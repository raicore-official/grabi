name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble, test, lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Theme color guard
        run: |
          kt=$(grep -rnE 'Color\.(White|Black|Red|Green|Blue|Yellow|Gray|LightGray|DarkGray)\b|Color\(0x|"#[0-9a-fA-F]{6,8}"' app/src/main/java --include='*.kt' | grep -v '/ui/theme/' || true)
          xml=$(grep -rnE '#[0-9a-fA-F]{3,8}' app/src/main/res/drawable --include='*.xml' | grep -v 'ic_launcher' || true)
          if [ -n "$kt$xml" ]; then
            echo "Hardcoded colors outside the theme package:"
            echo "$kt"
            echo "$xml"
            exit 1
          fi

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Verify theme snapshots against committed goldens
        run: ./gradlew :app:verifyPaparazziDebug --no-daemon

      - name: Run lint
        run: ./gradlew lintDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: grabi-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-lint-reports
          path: |
            app/build/reports/tests
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: Upload theme snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: theme-snapshots
          path: |
            app/src/test/snapshots
            app/build/reports/paparazzi
          if-no-files-found: ignore